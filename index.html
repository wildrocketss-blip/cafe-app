<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 520px;
      margin: 50px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .menu-item {
      display: grid;
      grid-template-columns: 1fr 80px 80px;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .item-name {
      font-weight: 600;
    }

    .price {
      text-align: right;
      color: #666;
    }

    input[type="number"] {
      width: 70px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #333;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #loading,
    #error {
      text-align: center;
      padding: 20px 0;
      color: #777;
    }

    #error {
      color: #b00020;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }

    .bill-line {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Café Bill Calculator</h1>
    <div class="subtitle">Select the quantity for each item</div>

    <div id="loading">Loading menu...</div>
    <div id="error" style="display: none;"></div>
    <div id="menu"></div>

    <button id="calculateButton" onclick="calculateBill()" disabled>
      Calculate Bill
    </button>

    <div id="result">
      <div id="billDetails"></div>

      <div class="total">
        <span>Total</span>
        <span id="totalAmount">$0.00</span>
      </div>
    </div>
  </div>

  <script>
    let items = [];

    async function loadMenu() {
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const calculateButton = document.getElementById("calculateButton");

      try {
        const response = await fetch("menu.csv");

        if (!response.ok) {
          throw new Error("Unable to load menu.csv");
        }

        const csvText = await response.text();
        items = parseCSV(csvText);

        if (items.length === 0) {
          throw new Error("No menu items found.");
        }

        displayMenu();

        loading.style.display = "none";
        calculateButton.disabled = false;

      } catch (err) {
        loading.style.display = "none";
        error.style.display = "block";
        error.textContent = "Unable to load the menu. Please check menu.csv.";
      }
    }

    function parseCSV(csvText) {
      const lines = csvText
        .trim()
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

      if (lines.length < 2) {
        return [];
      }

      return lines.slice(1).map(line => {
        const commaIndex = line.lastIndexOf(",");

        if (commaIndex === -1) {
          return null;
        }

        const name = line
          .substring(0, commaIndex)
          .trim()
          .replace(/^"|"$/g, "");

        const price = parseFloat(
          line.substring(commaIndex + 1).trim()
        );

        if (!name || isNaN(price)) {
          return null;
        }

        return {
          name: name,
          price: price
        };
      }).filter(item => item !== null);
    }

    function displayMenu() {
      const menu = document.getElementById("menu");
      menu.innerHTML = "";

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "menu-item";

        const itemName = document.createElement("div");
        itemName.className = "item-name";
        itemName.textContent = item.name;

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = "$" + item.price.toFixed(2);

        const quantity = document.createElement("input");
        quantity.type = "number";
        quantity.id = `qty-${index}`;
        quantity.min = "0";
        quantity.step = "1";
        quantity.value = "0";
        quantity.setAttribute(
          "aria-label",
          `${item.name} quantity`
        );

        row.appendChild(itemName);
        row.appendChild(price);
        row.appendChild(quantity);

        menu.appendChild(row);
      });
    }

    function calculateBill() {
      let total = 0;
      let billHTML = "";

      items.forEach((item, index) => {
        const input = document.getElementById(`qty-${index}`);

        const quantity = Math.max(
          0,
          parseInt(input.value, 10) || 0
        );

        input.value = quantity;

        if (quantity > 0) {
          const subtotal = item.price * quantity;
          total += subtotal;

          billHTML += `
            <div class="bill-line">
              <span>${escapeHTML(item.name)} × ${quantity}</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
          `;
        }
      });

      if (billHTML === "") {
        billHTML = `
          <div class="bill-line">
            <span>No items selected</span>
            <span>$0.00</span>
          </div>
        `;
      }

      document.getElementById("billDetails").innerHTML = billHTML;

      document.getElementById("totalAmount").textContent =
        "$" + total.toFixed(2);

      document.getElementById("result").style.display = "block";
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadMenu();
  </script>

</body>
</html>
