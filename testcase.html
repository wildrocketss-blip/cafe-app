<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 520px;
      margin: 50px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .menu-item {
      display: grid;
      grid-template-columns: 1fr 80px 80px;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .item-name {
      font-weight: 600;
    }

    .price {
      text-align: right;
      color: #666;
    }

    input[type="number"] {
      width: 70px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #333;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }

    .bill-line {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Café Bill Calculator</h1>
    <div class="subtitle">Select the quantity for each item</div>

    <div id="menu"></div>

    <button onclick="calculateBill()">Calculate Bill</button>

    <div id="result">
      <div id="billDetails"></div>

      <div class="total">
        <span>Total</span>
        <span id="totalAmount">$0.00</span>
      </div>
    </div>
  </div>

  <script>
    const items = [
      { name: "Chicken Rice", price: 4.50 },
      { name: "Nasi Lemak", price: 4.00 },
      { name: "Laksa", price: 5.00 },
      { name: "Kopi", price: 1.50 },
      { name: "Teh", price: 1.30 },
      { name: "Milo", price: 2.00 }
    ];

    const menu = document.getElementById("menu");

    items.forEach((item, index) => {
      menu.innerHTML += `
        <div class="menu-item">
          <div class="item-name">${item.name}</div>
          <div class="price">$${item.price.toFixed(2)}</div>
          <input
            type="number"
            id="qty-${index}"
            min="0"
            step="1"
            value="0"
            aria-label="${item.name} quantity"
          >
        </div>
      `;
    });

    function calculateBill() {
      let total = 0;
      let billHTML = "";

      items.forEach((item, index) => {
        const input = document.getElementById(`qty-${index}`);
        const quantity = Math.max(0, parseInt(input.value) || 0);

        input.value = quantity;

        if (quantity > 0) {
          const subtotal = item.price * quantity;
          total += subtotal;

          billHTML += `
            <div class="bill-line">
              <span>${item.name} × ${quantity}</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
          `;
        }
      });

      if (billHTML === "") {
        billHTML = `
          <div class="bill-line">
            <span>No items selected</span>
            <span>$0.00</span>
          </div>
        `;
      }

      document.getElementById("billDetails").innerHTML = billHTML;
      document.getElementById("totalAmount").textContent =
        "$" + total.toFixed(2);

      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
